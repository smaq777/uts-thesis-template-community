name: Build example PDFs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk poppler-utils texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Build all examples
        run: make all print
      - name: Confirm expected PDFs
        run: |
          test -s build/Thesis_CLEAN.pdf
          test -s build/Thesis_REVIEW.pdf
          test -s build/Revision_Response.pdf
          test -s build/Thesis_PRINT_SINGLE.pdf
          test -s build/Thesis_PRINT_DUPLEX.pdf
          test -s examples/pdfs/Thesis_CLEAN.pdf
          test -s examples/pdfs/Thesis_REVIEW.pdf
          test -s examples/pdfs/Revision_Response.pdf
          pdftotext examples/pdfs/Thesis_CLEAN.pdf - | grep -q "A Structured Research Journey"
          pdftotext examples/pdfs/Thesis_REVIEW.pdf - | grep -q "E1-01"
          pdftotext examples/pdfs/Revision_Response.pdf - | grep -q "Thesis Revision Response"
          pdftotext build/Thesis_PRINT_SINGLE.pdf - | grep -q "A Structured Research Journey"
          pdftotext build/Thesis_PRINT_DUPLEX.pdf - | grep -q "A Structured Research Journey"
      - name: Upload example PDFs
        uses: actions/upload-artifact@v4
        with:
          name: thesis-example-pdfs
          path: |
            build/Thesis_CLEAN.pdf
            build/Thesis_REVIEW.pdf
            build/Revision_Response.pdf
            build/Thesis_PRINT_SINGLE.pdf
            build/Thesis_PRINT_DUPLEX.pdf
